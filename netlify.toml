[build]
  publish = "."
  command = "echo 'No build needed - pure HTML'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}
  force = false

# تأكد من أن ملفات js تُعامل كـ modules
[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"
