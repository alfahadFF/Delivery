[build]
  publish = "."
  command = "echo 'No build needed - pure HTML'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# قاعدة توجيه عامة لتطبيقات الصفحة الواحدة (SPA) بدون شروط معقدة
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript"
